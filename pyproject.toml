[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[project]
name = "kamsekam"
version = "0.1.0"
description = "Delta-debug an HTTP request down to the smallest version that still works"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Nemo", email = "claude@captnemo.in" }]
keywords = ["http", "curl", "delta-debugging", "ddmin", "har", "bruno", "minimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "httpx2>=2.12.0",
]

[project.optional-dependencies]
impersonate = ["curl_cffi>=0.7"]

[project.urls]
Homepage = "https://github.com/captn3m0/kamsekam"
Issues = "https://github.com/captn3m0/kamsekam/issues"

[project.scripts]
kamsekam = "kamsekam.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-httpserver>=1.1", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE"]

[tool.ruff.lint.per-file-ignores]
"src/kamsekam/model.py" = ["SIM905"]
"src/kamsekam/parse/curl.py" = ["SIM905"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/kamsekam"]

[[tool.mypy.overrides]]
module = ["harfile.*", "curl_cffi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
python-preference = "only-system"
python-downloads = "never"
